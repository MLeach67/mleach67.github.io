<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="timer.css">
</head>
<body>
  <div class="timer-card">

    <div class="display" id="display">00</div>

    <div class="presets">
      <button class="preset-btn" data-seconds="15">15</button>
      <button class="preset-btn" data-seconds="30">30</button>
      <button class="preset-btn" data-seconds="45">45</button>
    </div>

    <div class="controls">
      <button id="startBtn">Start</button>
      <button id="stopBtn">Stop</button>
      <button id="resetBtn">Reset</button>
    </div>
        <hr class="divider">

    <div class="stopwatch">
      <div class="display" id="stopwatchDisplay">00:00:00</div>
      <div class="controls">
        <button id="swStartBtn">Start</button>
        <button id="swStopBtn">Stop</button>
        <button id="swResetBtn">Reset</button>
      </div>
    </div>
  </div>

  <script src="timer.js"></script>
</body>
</html>
